<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Sayed Jewellers | Luxury Defined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfbf7; color: #2d3748; }
        .lux-black { background-color: #1a1a1a; }
        .lux-gold { color: #c5a059; }
        .bg-lux-gold { background-color: #c5a059; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        
        .hero-section { 
            background: linear-gradient(rgba(26, 26, 26, 0.7), rgba(26, 26, 26, 0.7)), 
            url('https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=2000'); 
            background-size: cover; background-position: center; 
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="flex justify-between items-center px-10 py-6 bg-white border-b border-gray-100">
        <div class="font-cinzel text-xl tracking-[0.2em] font-bold">AL SAYED</div>
        <div class="space-x-8 text-xs font-semibold uppercase tracking-widest text-gray-500">
            <a href="#" class="hover:text-black">Home</a>
            <a href="#collections" class="hover:text-black">Collections</a>
            <a href="#rates" class="hover:text-black">Live Rates</a>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero-section h-[70vh] flex flex-col justify-center items-center text-white text-center px-6">
        <h1 class="text-6xl font-playfair italic font-bold">Timeless Elegance.</h1>
        <p class="mt-4 font-cinzel text-lg tracking-widest text-gray-300">CRAFTED WITH TRUST SINCE 1998</p>
        <button class="mt-10 px-10 py-4 bg-white text-black font-bold uppercase tracking-widest hover:bg-gray-200 transition">Visit Our Showroom</button>
    </header>

    <!-- COLLECTIONS SECTION -->
    <section id="collections" class="max-w-7xl mx-auto px-6 py-20">
        <h2 class="text-4xl font-cinzel text-center mb-16">Explore Our Collections</h2>
        <div class="grid md:grid-cols-2 gap-10">
            <!-- GOLD CARD -->
            <div class="group relative overflow-hidden bg-gray-100">
                <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e" class="w-full h-[400px] object-cover transition duration-500 group-hover:scale-105">
                <div class="absolute bottom-10 left-10 text-white">
                    <h3 class="text-3xl font-cinzel">Gold Jewellery</h3>
                    <button class="mt-4 px-6 py-2 border border-white hover:bg-white hover:text-black transition">Explore Gold</button>
                </div>
            </div>
            <!-- SILVER CARD -->
            <div class="group relative overflow-hidden bg-gray-100">
                <img src="https://images.unsplash.com/photo-1635767798638-3e25273a8236" class="w-full h-[400px] object-cover transition duration-500 group-hover:scale-105">
                <div class="absolute bottom-10 left-10 text-white">
                    <h3 class="text-3xl font-cinzel">Silver Collection</h3>
                    <button class="mt-4 px-6 py-2 border border-white hover:bg-white hover:text-black transition">Explore Silver</button>
                </div>
            </div>
        </div>
    </section>

    <!-- RATE SECTION -->
    <section id="rates" class="bg-gray-50 py-20">
        <div class="max-w-5xl mx-auto px-6">
            <h3 class="font-cinzel text-2xl text-center mb-10">Live Market Rates</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="bg-white p-6 shadow-sm text-center border-b-2 border-lux-gold">
                    <p class="text-xs text-gray-400">24K Gold</p>
                    <p class="text-xl font-bold mt-2 lux-gold" id="rate-24k">₹7,230</p>
                </div>
                <div class="bg-white p-6 shadow-sm text-center border-b-2 border-lux-gold">
                    <p class="text-xs text-gray-400">22K Gold</p>
                    <p class="text-xl font-bold mt-2 lux-gold" id="rate-22k">₹6,630</p>
                </div>
                <div class="bg-white p-6 shadow-sm text-center border-b-2 border-lux-gold">
                    <p class="text-xs text-gray-400">18K Gold</p>
                    <p class="text-xl font-bold mt-2 lux-gold" id="rate-18k">₹5,420</p>
                </div>
                <div class="bg-white p-6 shadow-sm text-center border-b-2 border-lux-gold">
                    <p class="text-xs text-gray-400">Silver</p>
                    <p class="text-xl font-bold mt-2 lux-gold" id="rate-silver">₹89.50</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="lux-black text-white py-10 text-center text-sm">
        <p>&copy; 2026 Al Sayed Jewellers. All Rights Reserved.</p>
    </footer>

</body>
</html>
