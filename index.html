<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Sayed Jewellers | Premium Emerald Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #022619; color: #e2e8f0; }
        .emerald-bg { background-color: #022619; }
        .gold-text { color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="p-6 flex justify-between items-center border-b border-gold-border/30">
        <h1 class="text-2xl font-cinzel text-gold-text tracking-widest">AL SAYED</h1>
        <div class="flex gap-6">
            <a href="#rates" class="text-xs uppercase tracking-widest hover:text-gold-text">Market Rates</a>
            <a href="#catalogue" class="text-xs uppercase tracking-widest hover:text-gold-text">Catalogue</a>
        </div>
    </nav>

    <!-- HERO -->
    <header class="py-20 text-center">
        <h2 class="text-5xl font-cinzel text-white">Elegance in Emerald</h2>
        <p class="mt-4 text-gray-400">Discover our handcrafted gold and silver masterpieces.</p>
    </header>

    <!-- LIVE RATES SECTION -->
    <section id="rates" class="max-w-4xl mx-auto px-6 mb-20">
        <div class="glass-card p-8 rounded-2xl">
            <h3 class="text-center font-cinzel text-gold-text mb-6">LIVE DELHI RATES</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="p-4 bg-black/20 rounded-xl text-center"><p class="text-[10px] text-gray-400">24K Gold</p><p id="rate-24k" class="font-bold text-gold-text">---</p></div>
                <div class="p-4 bg-black/20 rounded-xl text-center"><p class="text-[10px] text-gray-400">22K Gold</p><p id="rate-22k" class="font-bold text-gold-text">---</p></div>
                <div class="p-4 bg-black/20 rounded-xl text-center"><p class="text-[10px] text-gray-400">18K Gold</p><p id="rate-18k" class="font-bold text-gold-text">---</p></div>
                <div class="p-4 bg-black/20 rounded-xl text-center"><p class="text-[10px] text-gray-400">Silver</p><p id="rate-silver" class="font-bold text-gold-text">---</p></div>
            </div>
        </div>
    </section>

    <!-- CATALOGUE SECTION -->
    <section id="catalogue" class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-center gap-4 mb-10">
            <button onclick="filter('gold')" class="px-6 py-2 border border-gold-border text-gold-text rounded-full hover:bg-gold-text hover:text-black transition">GOLD COLLECTION</button>
            <button onclick="filter('silver')" class="px-6 py-2 border border-gold-border text-gold-text rounded-full hover:bg-gold-text hover:text-black transition">SILVER COLLECTION</button>
        </div>
        <div id="jewel-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Items injected by JS -->
        </div>
    </section>

    <!-- AI MODAL -->
    <div id="arModal" class="fixed inset-0 z-50 hidden bg-black flex flex-col items-center justify-center">
        <button onclick="closeModal()" class="absolute top-10 right-10 text-white text-3xl"><i class="fa-solid fa-xmark"></i></button>
        <canvas id="output_canvas" class="w-full max-w-2xl"></canvas>
    </div>

    <script>
        const catalog = [
            { id: 'g1', title: 'Heritage Jhumka', metal: 'gold', price: '₹92,500', img: 'https://images.unsplash.com/photo-1630019852942-f89202989a59' },
            { id: 's1', title: 'Lotus Earrings', metal: 'silver', price: '₹4,800', img: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908' }
        ];

        function render(metal = 'gold') {
            const grid = document.getElementById('jewel-grid');
            grid.innerHTML = catalog.filter(i => i.metal === metal).map(item => `
                <div class="glass-card p-4 rounded-2xl hover:scale-105 transition">
                    <img src="${item.img}" class="rounded-xl h-60 w-full object-cover">
                    <h4 class="mt-4 font-bold text-white">${item.title}</h4>
                    <p class="text-gold-text">${item.price}</p>
                    <button onclick="openModal('${item.id}')" class="mt-4 w-full bg-gold-text text-black py-2 rounded-lg font-bold">Try AI</button>
                </div>
            `).join('');
        }

        function filter(metal) { render(metal); }
        function openModal(id) { document.getElementById('arModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('arModal').classList.add('hidden'); }

        // Fetch Mock Rates
        window.onload = () => {
            render('gold');
            document.getElementById('rate-24k').innerText = '₹1,55,810';
            document.getElementById('rate-22k').innerText = '₹1,42,850';
            document.getElementById('rate-18k').innerText = '₹1,16,910';
            document.getElementById('rate-silver').innerText = '₹96,500';
        };
    </script>
</body>
</html>
