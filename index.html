<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Sayed Jewellers | Luxury Defined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e5e5e5; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        
        /* Premium Gold Gradient */
        .gold-gradient { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); }
        .text-gold { color: #D4AF37; }
        
        /* Preloader Styles */
        #preloader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .reveal-anim { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism Cards */
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body>

    <!-- 1. PRELOADER -->
    <div id="preloader">
        <div class="text-center">
            <h1 class="text-4xl font-cinzel text-gold tracking-[0.3em]">AL SAYED</h1>
            <div class="mt-4 w-16 h-[1px] bg-gold mx-auto animate-pulse"></div>
        </div>
    </div>

    <!-- 2. HERO SECTION (Cinematic Style) -->
    <header class="relative h-screen flex items-center justify-center overflow-hidden">
        <img src="https://images.unsplash.com/photo-1573408301185-9e4a36f71d53?q=80&w=2000" class="absolute inset-0 w-full h-full object-cover opacity-40 scale-105 animate-slow-zoom">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/50"></div>
        
        <div class="relative z-10 text-center px-4 reveal-anim">
            <span class="text-gold tracking-[0.5em] text-xs uppercase">Est. 2026</span>
            <h1 class="text-6xl md:text-8xl font-playfair mt-4 italic">Timeless Elegance</h1>
            <p class="mt-6 text-gray-400 font-light max-w-lg mx-auto italic">Crafting memories in gold, one masterpiece at a time.</p>
            <div class="mt-10 flex gap-4 justify-center">
                <a href="#catalogue" class="px-8 py-3 bg-gold text-black font-bold uppercase tracking-widest hover:scale-105 transition-transform">Explore</a>
                <a href="https://wa.me/918826836771" class="px-8 py-3 border border-gold text-gold hover:bg-gold hover:text-black transition-all">WhatsApp Us</a>
            </div>
        </div>
    </header>

    <!-- 3. LIVE RATES (Premium Ticker) -->
    <section class="max-w-5xl mx-auto -mt-20 relative z-20 px-6">
        <div class="glass-card p-8 rounded-sm grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            <div><p class="text-[10px] text-gray-500 uppercase tracking-widest">24K Gold</p><h4 class="text-xl font-bold mt-1" id="rate-24k">---</h4></div>
            <div><p class="text-[10px] text-gray-500 uppercase tracking-widest">22K Gold</p><h4 class="text-xl font-bold mt-1" id="rate-22k">---</h4></div>
            <div><p class="text-[10px] text-gray-500 uppercase tracking-widest">18K Gold</p><h4 class="text-xl font-bold mt-1" id="rate-18k">---</h4></div>
            <div><p class="text-[10px] text-gray-500 uppercase tracking-widest">Silver</p><h4 class="text-xl font-bold mt-1" id="rate-silver">---</h4></div>
        </div>
    </section>

    <!-- 4. FEATURED PRODUCTS -->
    <section id="catalogue" class="py-24 max-w-7xl mx-auto px-6">
        <h2 class="text-4xl font-cinzel text-center mb-16">Signature Collection</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Card 1 -->
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-white/5 h-96">
                    <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <h3 class="mt-6 font-cinzel text-xl text-gold">Royal Necklace</h3>
            </div>
            <!-- Card 2 -->
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-white/5 h-96">
                    <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <h3 class="mt-6 font-cinzel text-xl text-gold">Diamond Rings</h3>
            </div>
            <!-- Card 3 -->
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-white/5 h-96">
                    <img src="https://images.unsplash.com/photo-1611591475197-2856f6c77d48" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                </div>
                <h3 class="mt-6 font-cinzel text-xl text-gold">Bridal Bangles</h3>
            </div>
        </div>
    </section>

    <script>
        // Hide Preloader
        window.addEventListener('load', () => {
            document.getElementById('preloader').style.display = 'none';
        });

        // Mock Rates API
        async function fetchRates() {
            setTimeout(() => {
                document.getElementById('rate-24k').innerText = '₹1,55,810';
                document.getElementById('rate-22k').innerText = '₹1,42,850';
                document.getElementById('rate-18k').innerText = '₹1,16,910';
                document.getElementById('rate-silver').innerText = '₹96,500';
            }, 1000);
        }
        fetchRates();
    </script>
</body>
</html>
